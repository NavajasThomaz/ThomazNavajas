services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thomaz-navajas-app
    # Não expor porta externamente - apenas para cloudflared
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - ABACUS_API_URL=${ABACUS_API_URL:-https://apps.abacus.ai}
      - ABACUS_DEPLOYMENT_TOKEN=${ABACUS_DEPLOYMENT_TOKEN}
      - ABACUS_DEPLOYMENT_ID=${ABACUS_DEPLOYMENT_ID}
      - ABACUS_API_KEY=${ABACUS_API_KEY}
      - ABACUS_CONVERSATION_ID=${ABACUS_CONVERSATION_ID}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: thomaz-navajas-tunnel
    command: tunnel --config /tmp/cloudflared-config.yml run
    volumes:
      # Arquivo de configuração do tunnel
      - ./cloudflared-config.yml:/tmp/cloudflared-config.yml:ro
      # Credenciais do tunnel (geradas após login)
      - ${CLOUDFLARE_CREDENTIALS_PATH:-./.cloudflared}/:/etc/cloudflared/:ro
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: thomaz-navajas-backend
    expose:
      - "8000"
    environment:
      - DEFAULT_MODEL=qwen2.5:7b-instruct
      - OLLAMA_URL=http://ollama:11434
      - GOOGLE_SERVICE_ACCOUNT_FILE=/app/thomaznavajas-1fb7d419f135.json
      - GOOGLE_CALENDAR_ID=primary
      - GOOGLE_CALENDAR_OWNER_EMAIL=Thomaznavajas@gmail.com
      - GOOGLE_CALENDAR_DELEGATED_USER=${GOOGLE_CALENDAR_DELEGATED_USER}
    restart: unless-stopped
    volumes:
      - ./thomaznavajas-1fb7d419f135.json:/app/thomaznavajas-1fb7d419f135.json:ro
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: thomaz-navajas-ollama
    expose:
      - "11434"
    command: ["serve"]
    restart: unless-stopped
    profiles:
      - cpu
    environment:
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network

  ollama-pull:
    image: ollama/ollama:latest
    container_name: thomaz-navajas-ollama-pull
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull qwen2.5:7b-instruct"
    restart: "no"
    profiles:
      - cpu
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - app-network

  ollama-gpu:
    image: ollama/ollama:latest
    container_name: thomaz-navajas-ollama-gpu
    expose:
      - "11434"
    command: ["serve"]
    restart: unless-stopped
    profiles:
      - gpu
    environment:
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama-data:/root/.ollama
    networks:
      app-network:
        aliases:
          - ollama

  ollama-gpu-pull:
    image: ollama/ollama:latest
    container_name: thomaz-navajas-ollama-gpu-pull
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull qwen2.5:7b-instruct"
    restart: "no"
    profiles:
      - gpu
    depends_on:
      - ollama-gpu
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
